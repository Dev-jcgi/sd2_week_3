name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Opcional: si defines el secreto FIREBASE_CONFIG (el objeto JSON de la configuración web),
      # se escribe site/firebase-config.js en el momento de publicar.
      - name: Configurar Firebase desde el secreto
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            echo "window.FIREBASE_CONFIG = $FIREBASE_CONFIG;" > site/firebase-config.js
            echo "firebase-config.js generado desde el secreto."
          else
            echo "Sin secreto FIREBASE_CONFIG: se publica el archivo del repositorio."
          fi

      - name: Revisar sintaxis de los scripts
        run: |
          for f in site/*.js; do node --check "$f"; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
